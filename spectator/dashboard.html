<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Evaluation · Evolving Poker</title>
<meta name="theme-color" content="#0b0e0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0e0c;--panel:#111813;--panel2:#171e19;--line:#26352b;--cream:#f5f0e4;--muted:#8a9a8f;--brass:#c9a227;--green:#4ade80;--red:#f87171;--mono:'JetBrains Mono',ui-monospace,monospace;--disp:'Big Shoulders Display',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),radial-gradient(900px 520px at 15% -10%,#193425 0%,transparent 64%),var(--ink);background-size:100% 34px,auto;color:var(--cream);font-family:var(--mono);font-size:13px}
a{color:inherit}
a.button{border:1px solid var(--line);border-radius:3px;background:transparent;color:var(--cream);padding:9px 13px;font:700 9px var(--mono);letter-spacing:.15em;text-transform:uppercase;text-decoration:none}
a.button:hover{border-color:var(--brass);color:var(--brass)}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:13px 28px;border-bottom:1px solid var(--line);background:rgba(11,14,12,.94);backdrop-filter:blur(14px)}
.brand .eyebrow,.eyebrow{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--brass)}
.brand h1{font:800 30px/1 var(--disp);letter-spacing:.03em;text-transform:uppercase}.brand h1 span{color:var(--brass)}
.nav{display:flex;align-items:center;gap:9px}.nav .active{border-color:var(--green);color:var(--green)}
main{width:min(1440px,calc(100% - 40px));margin:0 auto;padding:30px 0 80px}
.loading{min-height:68vh;display:grid;place-items:center}.loading-card{width:min(620px,100%);border:1px solid var(--line);background:var(--panel);padding:36px}
.loading-card h2{font:700 38px/1 var(--disp);margin:10px 0}.loading-card p{color:var(--muted);line-height:1.7;margin-bottom:20px}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brass);animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.25}}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end;padding:30px 0 24px}
.hero h2{font:800 clamp(48px,7vw,92px)/.9 var(--disp);letter-spacing:-.015em;max-width:1000px;text-transform:uppercase;margin:12px 0 16px}.hero h2.positive{color:var(--green)}
.hero p{max-width:780px;color:#b4beb6;line-height:1.65;font-size:14px}
.run-stamp{text-align:right;border-left:1px solid var(--line);padding-left:28px;min-width:190px}.run-stamp b{display:block;font:700 34px/1 var(--disp);color:var(--brass)}.run-stamp span{display:block;color:var(--muted);font-size:9px;letter-spacing:.15em;text-transform:uppercase;margin-top:5px}
.coverage{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:var(--panel);margin-bottom:34px}
.gate{padding:15px 17px;border-right:1px solid var(--line);min-height:92px}.gate:last-child{border-right:0}.gate .state{display:flex;align-items:center;gap:7px;font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.gate .dot{width:7px;height:7px;border-radius:50%;background:var(--red)}.gate.pass .dot{background:var(--green)}.gate.partial .dot{background:var(--brass)}
.gate b{display:block;font:700 22px/1.05 var(--disp);margin:11px 0 4px}.gate p{font-size:9px;color:var(--muted);line-height:1.5}
section{margin-top:34px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:13px}
.section-head h3{font:700 31px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase}.section-head p{font-size:9px;color:var(--muted);max-width:580px;text-align:right;line-height:1.5}
.table-wrap{border:1px solid var(--line);background:var(--panel);overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1040px}
th{text-align:left;padding:12px 13px;border-bottom:1px solid var(--line);font-size:8px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-weight:500}
td{padding:15px 13px;border-bottom:1px solid #1d2a21;vertical-align:middle}tbody tr:last-child td{border-bottom:0}
.agent{border-left:3px solid var(--ac);padding-left:12px}.agent b{display:block;color:var(--ac);letter-spacing:.1em}.agent small{display:block;color:var(--muted);margin-top:4px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.metric b{font:700 21px/1 var(--disp)}.metric span{display:block;color:var(--muted);font-size:8px;margin-top:3px}.na{color:#59675e}
.bar{width:82px;height:4px;background:#28352c;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;width:var(--v);background:var(--ac)}
.proofs{display:grid;gap:10px}.proof{display:grid;grid-template-columns:1.05fr 38px 1.2fr 38px 1.1fr;align-items:stretch;border:1px solid var(--line);background:var(--panel)}
.proof-stage{padding:17px;min-width:0}.proof-stage .label{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}.proof-stage b{font-size:12px;line-height:1.55;color:var(--cream)}.proof-stage p{font-size:10px;color:#aab4ac;line-height:1.55;margin-top:6px}
.proof-arrow{display:grid;place-items:center;border-left:1px solid var(--line);border-right:1px solid var(--line);color:var(--brass);font-size:18px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.chips span{border:1px solid var(--line);padding:3px 6px;color:var(--brass);font-size:8px}
.proof-result{border-left:3px solid var(--result)}.proof-result b{display:block}.proof-result .verdict{display:inline-block;margin-top:10px;color:var(--result);font-size:8px;letter-spacing:.14em;text-transform:uppercase}
.empty-proof{border:1px solid var(--line);background:var(--panel);padding:28px}.empty-proof strong{font:700 27px/1 var(--disp);display:block;margin-bottom:8px}.empty-proof p{color:var(--muted);line-height:1.6}
.systems{display:grid;grid-template-columns:2fr 1fr;gap:14px}.system{border:1px solid var(--line);background:var(--panel);padding:19px}
.loop{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;border:1px solid var(--line)}.loop-step{padding:14px;min-height:126px;border-right:1px solid var(--line);position:relative}.loop-step:last-child{border-right:0}
.loop-step::after{content:"›";position:absolute;right:-7px;top:47px;color:var(--brass);z-index:1}.loop-step:last-child::after{display:none}
.loop-step .status{font-size:7px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.loop-step.live .status{color:var(--green)}.loop-step.missing .status{color:var(--red)}
.loop-step b{display:block;margin:10px 0 6px;font-size:11px}.loop-step p{color:var(--muted);font-size:8px;line-height:1.5}
.system-note{margin-top:15px;color:#aab4ac;font-size:9px;line-height:1.65}.system-note a{color:var(--green)}
.band-counts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.band-count{border:1px solid var(--line);padding:13px}.band-count b{display:block;font:700 28px/1 var(--disp)}.band-count span{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
details{border:1px solid var(--line);background:var(--panel);padding:0 17px}summary{cursor:pointer;padding:15px 0;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--brass)}
.method{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:0 0 18px}.method b{font-size:10px}.method p{color:var(--muted);font-size:9px;line-height:1.55;margin-top:6px}
footer{border-top:1px solid var(--line);margin-top:40px;padding-top:18px;color:var(--muted);font-size:9px;line-height:1.6}
@media(max-width:980px){.coverage{grid-template-columns:1fr 1fr}.gate:nth-child(2){border-right:0}.gate:nth-child(-n+2){border-bottom:1px solid var(--line)}.proof{grid-template-columns:1fr}.proof-arrow{min-height:28px;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(90deg)}.systems{grid-template-columns:1fr}.loop{grid-template-columns:1fr 1fr}.loop-step:nth-child(2){border-right:0}.loop-step:nth-child(-n+2){border-bottom:1px solid var(--line)}.loop-step::after{display:none}.method{grid-template-columns:1fr 1fr}}
@media(max-width:620px){header{padding:12px 16px}.brand .eyebrow{display:none}.brand h1{font-size:23px}main{width:min(100% - 28px,1440px);padding-top:14px}.hero{grid-template-columns:1fr}.run-stamp{text-align:left;border-left:0;border-top:1px solid var(--line);padding:13px 0 0}.coverage,.loop,.method{grid-template-columns:1fr}.gate,.loop-step{border-right:0;border-bottom:1px solid var(--line)}.section-head{align-items:start;flex-direction:column}.section-head p{text-align:left}.nav .button:first-child{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="eyebrow">Agent adaptation observatory</div><h1>Evolving <span>Poker</span></h1></div>
  <nav class="nav" aria-label="Primary navigation"><a class="button" href="/">Live table</a><a class="button active" href="/dashboard" aria-current="page">Evaluation</a></nav>
</header>
<main id="app">
  <div class="loading"><div class="loading-card">
    <div class="eyebrow"><span class="pulse"></span>&nbsp; Evaluation engine</div>
    <h2>Reading the tournament record</h2>
    <p id="loadingMessage">Linking decisions, reflections, strategy changes and outcomes.</p>
    <a class="button" href="/">Return to live table</a>
  </div></div>
</main>
<script>
const app=document.getElementById('app');
const colors={playerA:'#5bd6c0',playerB:'#b78bff',playerC:'#f0789c',playerD:'#f0a868'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const pct=v=>v==null?'<span class="na">not assessable</span>':`<b>${v.toFixed(0)}%</b>`;
const signed=v=>`${v>0?'+':''}${v.toFixed(1)}`;
const money=v=>`$${v.toFixed(4)}`;
const proofColor=s=>s==='followed'?'#4ade80':s==='diverged'?'#f87171':'#c9a227';
const proofLabel=s=>s==='followed'?'behavior followed change':s==='diverged'?'behavior did not follow':'not enough later evidence';
function gate(cls,state,title,detail){return `<div class="gate ${cls}"><div class="state"><span class="dot"></span>${state}</div><b>${title}</b><p>${detail}</p></div>`}
function scoreCell(value,label,color){if(value==null)return `<td class="metric">${pct(value)}<span>${label}</span></td>`;return `<td class="metric" style="--ac:${color};--v:${value}%">${pct(value)}<div class="bar"><i></i></div><span>${label}</span></td>`}
function render(data){
  const coverage=data.coverage;
  const visibleProofs=data.proofs.slice(0,6);
  const proofs=visibleProofs.length?visibleProofs.map(proof=>`
    <article class="proof" style="--result:${proofColor(proof.followThrough)}">
      <div class="proof-stage"><div class="label">${esc(proof.name)} · after hand ${proof.sourceHand}</div><b>Evidence received</b><div class="chips">${proof.evidence.length?proof.evidence.map(item=>`<span>${esc(item)}</span>`).join(''):'<span>no hand IDs</span>'}</div></div>
      <div class="proof-arrow">→</div>
      <div class="proof-stage"><div class="label">Agent state change</div><b>${esc(proof.change)}</b></div>
      <div class="proof-arrow">→</div>
      <div class="proof-stage proof-result"><div class="label">${proof.observationHand?`observed hand ${proof.observationHand}`:'observation window'}</div><b>${esc(proof.observation)}</b><span class="verdict">${proofLabel(proof.followThrough)}</span></div>
    </article>`).join(''):`<div class="empty-proof"><strong>No adaptation proof chain exists for this run.</strong><p>The agents reflected, but none changed strategy or model. That is a valid experimental result—not an improvement claim.</p></div>`;
  app.innerHTML=`
    <section class="hero"><div><div class="eyebrow">Run verdict · evidence before narrative</div><h2 class="${data.verdict.level}">${esc(data.verdict.label)}</h2><p>${esc(data.verdict.detail)}</p></div><div class="run-stamp"><b>${data.handsPlayed} hands</b><span>seed ${esc(data.seed)} · exploratory sample</span></div></section>
    <div class="coverage" aria-label="Evaluation coverage">
      ${gate(coverage.outcomesLinked?'pass':'','outcomes','Every decision linked',coverage.outcomesLinked?'All hand outcomes are present.':'Outcome records are incomplete.')}
      ${gate(coverage.appliedChanges?'pass':'partial','adaptation',`${coverage.appliedChanges} applied change${coverage.appliedChanges===1?'':'s'}`,'Holds are reported, never hidden.')}
      ${gate(coverage.comparableChanges?'pass':'partial','follow-through',`${coverage.comparableChanges} comparable change${coverage.comparableChanges===1?'':'s'}`,'Later behavior can be checked.')}
      ${gate('','causality','Counterfactual not run','We do not claim the change caused improvement.')}
    </div>
    <section><div class="section-head"><h3>Agent evaluation</h3><p>Outcome lift is directional. The percentage scores measure evidence quality, follow-through, stability and mechanical reliability—not poker “accuracy.”</p></div>
      <div class="table-wrap"><table><thead><tr><th>Agent / current model</th><th title="Second-half average chip delta minus first-half average chip delta">Outcome lift</th><th title="Reflections whose evidence contains valid prior hand IDs">Evidence grounding</th><th title="Applied changes followed by the expected next comparable behavior">Follow-through</th><th title="100 minus volatility, oscillation and failure penalties">Stability</th><th title="Inference calls without invalid output or timeout">Reliability</th><th>Spend</th></tr></thead>
      <tbody>${data.players.map(player=>{const color=colors[player.playerId]||'#c9a227';return `<tr style="--ac:${color}"><td class="agent"><b>${esc(player.name)}</b><small>${esc(player.model)}</small></td><td class="metric"><b>${signed(player.outcomeLift)}</b><span>chips/hand · 2H vs 1H</span></td>${scoreCell(player.evidenceGrounding,'valid hand references',color)}${scoreCell(player.behaviorFollowThrough,player.assessedChanges?`${player.assessedChanges} assessed`:'no comparable change',color)}${scoreCell(player.stabilityScore,`${player.changes} changes · ${player.modelMigrations} migrations`,color)}${scoreCell(player.reliability,'valid calls',color)}<td class="metric"><b>${money(player.costUsd)}</b><span>this run</span></td></tr>`}).join('')}</tbody></table></div>
    </section>
    <section><div class="section-head"><h3>Adaptation proof chain</h3><p>The useful unit is not a rising line. It connects evidence, a state change and a later comparable decision.${data.proofs.length>6?` Showing 6 of ${data.proofs.length}.`:''}</p></div><div class="proofs">${proofs}</div></section>
    <section class="systems">
      <div class="system"><div class="eyebrow">Pioneer · Adaptive Inference readiness</div><div class="loop">
        <div class="loop-step live"><span class="status">captured</span><b>Inference traffic</b><p>${data.pioneer.inferenceIdsCaptured} Pioneer inference IDs available in the public action trace.</p></div>
        <div class="loop-step live"><span class="status">linked</span><b>Outcome evidence</b><p>${data.pioneer.decisionsLinkedToOutcomes} decisions paired with resolved hand outcomes.</p></div>
        <div class="loop-step missing"><span class="status">not wired</span><b>Correction feedback</b><p>No verdict or corrected output is submitted to Pioneer yet.</p></div>
        <div class="loop-step missing"><span class="status">not claimed</span><b>Checkpoint promotion</b><p>No retraining or promoted checkpoint is claimed by this demo.</p></div>
      </div><p class="system-note">Adaptive Inference becomes the model-level evolution loop: Pioneer mines logged traffic and explicit corrections, retrains and evaluates a checkpoint, then keeps the endpoint stable when a better version is promoted. <a href="https://docs.pioneer.ai/guides/adaptive-inference" target="_blank" rel="noreferrer">Pioneer documentation ↗</a></p></div>
      <div class="system"><div class="eyebrow">Band · interaction provenance</div><div class="band-counts"><div class="band-count"><b>${data.band.playerEvents}</b><span>player events</span></div><div class="band-count"><b>${data.band.dealerEvents}</b><span>local dealer events</span></div></div><p class="system-note">Band gives each player a persistent sender identity. Player actions, winner summaries and evolution events can be separated from local game-engine control.</p></div>
    </section>
    <section><details><summary>How these metrics are calculated</summary><div class="method">
      <div><b>Outcome lift</b><p>Average chip delta in the second half minus the first half. Directional and luck-influenced.</p></div><div><b>Evidence grounding</b><p>Share of valid reflections whose evidence references real hands at or before that reflection.</p></div><div><b>Behavior follow-through</b><p>Whether the next comparable action moved in the direction implied by the largest strategy-dial change.</p></div><div><b>Stability</b><p>A transparent heuristic: 100 minus volatility, oscillation and inference-failure penalties.</p></div><div><b>Reliability</b><p>Share of Pioneer action and reflection calls that avoided invalid output and timeout.</p></div><div><b>Causality gate</b><p>No counterfactual run exists yet, so the dashboard never calls observed outcome lift causal improvement.</p></div>
    </div></details></section>
    <footer>This dashboard evaluates adaptation behavior in one run. A production benchmark would rotate seats, repeat seeds and compare evolved versus frozen policies on identical states.</footer>`;
}
let attempts=0;
async function load(){try{const response=await fetch('/api/evaluation',{cache:'no-store'});const data=await response.json();if(response.ok){render(data);return}document.getElementById('loadingMessage').textContent=data.message||'Run a tournament to generate an evaluation.';if(response.status===202&&attempts++<180)setTimeout(load,2000)}catch{document.getElementById('loadingMessage').textContent='The evaluation endpoint is unavailable. Restart the demo server and try again.'}}
load();
</script>
</body>
</html>
